name: readme-sync

on:
  schedule: [{cron: "57 6 * * *"}]
  workflow_dispatch:
  push:
    paths: ["README.tpl.md", "tools/readme-sync.mjs"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: node tools/readme-sync.mjs

      - name: Privacy guard
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: node tools/privacy-guard/cli.mjs 'README.md'

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --staged --quiet || git commit -m "chore(readme): sync generated sections [skip ci]"
          git push
